services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goofy}
      POSTGRES_USER: ${POSTGRES_USER:-goofy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Persistent state stays in the Goofy workspace, never in the host daemon.
      - ${GOOFY_DATA_DIR:-/home/goofy/agent-os/data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-goofy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-goofy}
      OWNER_DASHBOARD_TOKEN: ${OWNER_DASHBOARD_TOKEN:?set OWNER_DASHBOARD_TOKEN in .env}
      PORT: 3000
      OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
      MEM0_URL: ${MEM0_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # The dashboard is reachable only on the owner's private network.
      # PostgreSQL has no host port and remains on this Compose network.
      - "${AGENT_OS_BIND_ADDRESS:-0.0.0.0}:${AGENT_OS_PORT:-9999}:3000"
    command: ["sh", "-c", "npm run migrate && npm start"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
